# Infraestrutura local de desenvolvimento. Não é uma configuração de produção.
# Credenciais vêm do `.env` (copie de `.env.example`); o Compose falha se faltarem.
name: wagering-processor

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
    ports:
      # Exposto apenas no loopback do host.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial usa /var/lib/postgresql como raiz do volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  # Emulador local compatível com a API do SQS (filas FIFO, deduplicação, DLQ via RedrivePolicy).
  # Sem credenciais reais. Estado apenas em memória: filas e mensagens somem ao recriar o container;
  # recrie as filas com `bun run sqs:provision` (ou `bun run sqs:up`).
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      # Exposto apenas no loopback do host.
      - "127.0.0.1:${SQS_PORT:-9324}:9324"
    # A imagem declara VOLUME /data (usado só com persistência habilitada). O tmpfs no mesmo caminho
    # evita a criação de um volume anônimo.
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9324/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped

volumes:
  postgres-data:
