# Infraestrutura local de desenvolvimento. Não é uma configuração de produção.
# Credenciais vêm do `.env` (copie de `.env.example`); o Compose falha se faltarem.
name: wagering-processor

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
    ports:
      # Exposto apenas no loopback do host.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial usa /var/lib/postgresql como raiz do volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

volumes:
  postgres-data:
