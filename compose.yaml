# Infraestrutura local de desenvolvimento. Não é uma configuração de produção.
# Credenciais vêm do `.env` (copie de `.env.example`); o Compose falha se faltarem.
name: wagering-processor

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
    ports:
      # Exposto apenas no loopback do host.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial usa /var/lib/postgresql como raiz do volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  # MiniStack (emulador AWS citado no §4 do desafio), usado só pelo SQS: filas FIFO, deduplicação,
  # visibilidade e DLQ via RedrivePolicy. Sem conta nem token. Estado apenas em memória (sem
  # PERSIST_STATE): filas e mensagens somem ao recriar o container; recrie as filas com
  # `bun run sqs:provision` (ou `bun run sqs:up`).
  sqs:
    image: ministackorg/ministack:1.5.27
    ports:
      # Exposto apenas no loopback do host. O MiniStack monta a URL da fila a partir do Host da
      # requisição, então a porta do host pode diferir da 4566 do container.
      - "127.0.0.1:${SQS_PORT:-9324}:4566"
    # A imagem declara VOLUMEs para scripts de inicialização, que não usamos. O tmpfs nos mesmos
    # caminhos evita a criação de volumes anônimos.
    tmpfs:
      - /docker-entrypoint-initaws.d
      - /etc/localstack/init
    healthcheck:
      # A imagem não tem wget nem curl; usa o Python dela.
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request as r; r.urlopen(''http://127.0.0.1:4566/_ministack/health'')" || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped

volumes:
  postgres-data:
